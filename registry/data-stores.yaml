postgres_adapteng_ops:
  service: postgres-adapteng-ops (internal Coolify; SSL disabled on internal network)
  authority: operational truth — id allocation, lead reservation, run/approval ledger
  schemas: [public, integrity]
  migrations:
    - { file: 001_id_allocator.sql,               provides: "AE-* id allocator (public)",                      live: true,  applied: "adapter first boot (RUN_MIGRATIONS_ON_START)" }
    - { file: 002_run_ledger.sql,                 provides: "task/run/outcome ledger",                         live: false }
    - { file: 003_approval_outbox.sql,            provides: "approval ledger + outbox (hash-only tokens)",     live: false }
    - { file: 004_lead_identity.sql,              provides: "public.lead_identity_reservation + reserve_lead_identity()", live: true, applied: "2026-07-25 (WEB-002); function pins search_path=pg_catalog,public" }
    - { file: 005_ai_gateway.sql,                 provides: "AI gateway cost/run ledger",                      live: false }
    - { file: 006_integrity_projection_manifest.sql, provides: "integrity schema: projection_manifest + coverage_marker", live: false, note: "kept unapplied until backup/restore planning per ARCHITECTURE.md §11 + ADR-0011" }
    - { file: 007_source_identity_reservation.sql, provides: "canonical source identity to allocator-returned AE-CGR reservation", live: false, note: "repository-merged via automation PR #89; unapplied" }
    - { file: 008_drive_bridge_replay_reservations.sql, provides: "atomic governed Drive replay reservations", live: false, note: "repository-merged via automation PR #89; unapplied" }
  approved_source_import:
    repository_status: repo-merged-not-live
    repository_status_updated: 2026-07-29
    merge: "adapteng-automation-platform PR #89 / dbcf806ea7714b8e2a7415ae6cd788491924178d"
    reviewed_tree: 8fc649a97963f38ce0a7592001a7fea4834eceea
    permitted_migrations: [007_source_identity_reservation.sql, 008_drive_bridge_replay_reservations.sql]
    forbidden_migration: 008_ai_gateway_runtime_hardening.sql
    note: "No workflow dispatch or live database mutation occurred; repository readiness is not live readiness."
  backup:
    last_verified: "2026-07-25 13:31 (35.21 KB, Coolify local + owner download)"
    last_verified_contract_status: insufficient-logical-backup
    management: "operator-managed pgBackRest using provider-managed Backblaze B2 object storage; not provider-managed PostgreSQL backup"
    proposed_design: "pinned pgBackRest 2.59.0 physical base backup + continuous WAL, client-side encrypted to private Backblaze B2 EU Central; weekly full, daily differential, 12-full count retention"
    proposed_design_status: restore-rehearsal-passing-production-backup-not-configured
    object_store_connectivity:
      status: verified
      verified: 2026-08-02
      evidence_run: 30752237109
      evidence_workflow: ".github/workflows/verify-b2-connectivity.yml at 7f5f3585588da8b330e4ae9779f0b6343e1156eb (workflow_dispatch, conclusion success, 2026-08-02T14:30:06Z)"
      proven: "the configured credentials authenticate against the private Backblaze B2 EU Central bucket, and a probe object was written, read back and byte-compared, deleted, then asserted absent with head-object - so writes land, reads return the same bytes, deletes really delete, and bucket Object Lock is not silently retaining objects and making retention unenforceable"
      not_proven: "NO PRODUCTION BACKUP EXISTED AS OF THAT RUN. Nothing in that run touched PostgreSQL: no pgBackRest install, no stanza, no full or differential backup, no WAL archive, no check, no verify, no restore. The probe object was written under a connectivity-check/ prefix outside the pgBackRest repository path. Reaching the object store is a precondition of the backup design, not evidence of it. For what has since been proven about the backup and restore contour itself, see restore_rehearsal below; production remains unbacked either way."
      configuration_home: "GitHub repository variables PGBACKREST_REPO1_* (8) plus 3 repository secrets; the values are deliberately not recorded in Git, so the variables are the single source of truth for bucket, endpoint, region, key type, URI style, repository path and cipher type"
      reverify: "re-dispatch the Verify B2 connectivity workflow; it is dispatch-only, mutates no database, and writes only outside the pgBackRest repository path"
    restore_rehearsal:
      status: passing
      verified: 2026-08-03
      evidence_run: 30811383748
      evidence_workflow: ".github/workflows/postgres-backup-rehearsal.yml at 1f270cfb668c2ffaddd95f21db90ae17c811ef9a (workflow_dispatch, conclusion success, 2026-08-03T11:54:39Z to 2026-08-03T11:56:55Z, 23 of 23 steps succeeded with none skipped and none failed)"
      proven: "PostgreSQL 16 and pgBackRest were installed, a stanza created, and a real full backup taken to the private Backblaze B2 EU Central bucket with client-side encryption (pgBackRest reported full backup size = 29.3MB, file total = 989; B2 then held 14 objects totalling 9437040 bytes under the run-scoped prefix). The repository was verified, WAL was archived, the source cluster was destroyed before any restore so the restored bytes could only have come out of B2, and two restores were performed: an immediate restore that reproduced the pre-backup state exactly (backed_up and restored identical across 4 tables and 45001 rows) and a second restore to the end of the archived WAL that reproduced the post-change state exactly (post_backup and restored_to_latest identical across 5 tables and 46203 rows). The rehearsal repository was then removed from B2 and the prefix asserted empty, so deletes really delete."
      negative_control: "in the same job the immediate restore was also compared against the deliberately-changed post-backup source and correctly reported post_backup and restored differ in 6 ways, as required - the comparison was therefore demonstrated capable of returning a difference in the same run, which is what makes the two identity results evidence rather than a vacuous pass"
      isolation: "65 isolation assertions fired across the job in six groups (15, 13, 9, 11, 9 and 8 checks), all established; every cluster was created inside the runner temporary directory with listen_addresses empty so it had no TCP listener, and the run-scoped repository prefix /restore-rehearsal/30811383748-1 shares no path lineage with the production repository path"
      not_proven: "PRODUCTION IS STILL NOT BACKED UP. The rehearsal database is disposable and seeded with synthetic content; no production database was read, referenced, or in fact reachable. No production stanza, no schedule, no retention enforcement and no monitoring exist. A passing rehearsal proves the contour, the credentials and the object store - it does not prove that adapteng_ops has a recoverable backup."
      egress_measured: "one complete rehearsal writes about 9.0 MB into B2 and downloads it twice for the two restores, so on the order of 20 MB of egress, about USD 0.0002 at the USD 0.01/GB list price; the USD 1.00/day download-bandwidth cap therefore permits roughly 5000 rehearsals per day and is not a practical constraint on this contour"
      earlier_failure_cause: "the thirteen consecutive failures between 2026-08-03T01:39Z and 2026-08-03T09:05Z were NOT a code defect. The identical head 1f270cfb had already succeeded three times (runs 30774630135, 30774989967 and 30777047810, the last green at 01:31:03Z). Backblaze B2 was refusing download-class requests with AccessDenied 'Cannot download file, download bandwidth or transaction (Class B) cap exceeded'; a HEAD carries no response body, so pgBackRest could only ever surface a bare 403 with a content-length for a body it never received. Class A/B/C transactions are free on the account plan and the console exposes no Class B cap control, so the binding limit was the download-bandwidth cap. Raising it to USD 1.00/day cleared both workflows with no code change, on the same commit."
      reverify: "re-dispatch the PostgreSQL backup and restore rehearsal workflow; it uses no production credential, creates every cluster in the runner temporary directory, writes only under a run-scoped prefix, and deletes that prefix before it finishes"
    compatibility_gate: "separately reviewed source/derived image manifests; Docker-measured .Image/config ID/sole RepoDigest/platform/PGDATA; exact runtime signature; pinned PostgreSQL/pgBackRest binaries; complete canonical catalog signature; A/B/C must match source before migration"
    integrity_gate: "fresh selected full; post-backup pgBackRest check plus selected-set verify parsed to exactly status: ok; healthy WAL archive; digest-only set reference; tracked procedure/probe digests"
    restore_design: "sole tracked guarded A|B|C entrypoint on three independently created clean Hetzner PostgreSQL-only hosts; wrapper-generated exact pgBackRest config plus fixed descriptor-only secrets; authoritative private target IDs with complete never-started config validation and ID-only start; one-use target-bound provider challenges through the pinned signed owner broker proving exact firewall and empty private_net before target start/SQL and after cleanup; same-ID sealed runner plus complete live Docker inventory; no production snapshot/app clone, public DB, Docker socket or production credentials"
    acceptance: "A pre-migration exact restore; B exact 007/Drive-008 apply plus digest-verified fail-closed DML transaction rollback with zero durable synthetic state; C independent re-restore ending in exact migrated state equal to B; all statuses through nonzero-preserving expected-state gate; cleanup and reviewed digest-only PASS"
    retention_gate: "canonical fixed O_EXCL accepted packet binds verified selected-set bytes/completion, pinned exporter identity, declared dedicated-host scope with no user managers/linger, exclusive repository-write capability, directly resolved full/differential jobs, every installed/loaded/transient systemd and per-user source, cron/anacron/at spool, container and all-UID root/admin/writer-capable process, plus exact 12-slot weekly repository bytes; current shared Coolify scope is not accepted without a separately reviewed exclusive broker; authorization co-binds accepted plus fresh current inventories"
    rollout_evidence_schema_dependency: "BLOCKED: a separately reviewed automation evidence-lifecycle schema, validator, fixtures and consumer PR must merge and validate exactly the five sanitized fields; no final schema version or compatibility is claimed"
    rollout_authorization_status: NOT_READY_PENDING_AUTOMATION_EVIDENCE_LIFECYCLE_PR
    cost_gate: "owner-approved current quote for Hetzner compute/IPv4/Volume/VAT and B2 active+hidden storage, verify plus three-restore egress and other nonzero charges"
    forbidden_substitutes: [Coolify pg_dump, manual logical dump, Baserow all-in-one backup, running-server Hetzner snapshot, Object Lock as retention substitute]
    policy: no migration until the separately reviewed image/collector/harness implementation exists, the proposed design is configured, every acceptance gate passes, and the cross-repository rollout evidence schema dependency merges; see runbooks/backup-and-restore.md

