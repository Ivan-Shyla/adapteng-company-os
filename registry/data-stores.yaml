# AdaptEng Company OS — Data Store Registry
# Authorities, identifiers and migration state. No secrets, no PII, no row data.
# Precedence (ADR-0011 platform layer map):
#   Postgres = operational truth | Baserow = structured collaboration | Drive = document/media evidence
version: 1
updated: 2026-07-29

baserow:
  service: baserow-self-hosted (https://baserow.adapteng.com)
  workspace: { name: "AdaptEng OS", id: 161 }
  database: { name: "Company Operations", id: 260 }
  provisioned: "8 tables / 107 fields / 10 views (idempotent, PR #76)"
  authority: structured human collaboration (the single human work surface)
  human_owned_fields:   # NEVER overwritten by any workflow/agent; excluded from reconciliation comparison
    - Content_Items.content_type
    - Systems_Automations.health
  physical_table_aliases:  # two logical kinds share one physical table (intentional)
    - { logical: [PROJECT, CASE], table: Projects_Cases, id: 845 }
    - { logical: [CONTENT, CONTENT_GROUP], table: Content_Items, id: 848 }
  tables:
    - { name: Organizations,       id: 842, business_id_prefixes: [AE-ORG] }
    - { name: People,              id: 843, business_id_prefixes: [AE-PER] }
    - { name: Opportunities,       id: 844, business_id_prefixes: [AE-OPP] }
    - { name: Projects_Cases,      id: 845, business_id_prefixes: [AE-PRJ, AE-CAS] }
    - { name: Actions,             id: 846, business_id_prefixes: [AE-ACT] }
    - { name: Documents_Evidence,  id: 847, business_id_prefixes: [AE-DOC] }
    - { name: Content_Items,       id: 848, business_id_prefixes: [AE-CNT, AE-CGR] }
    - { name: Systems_Automations, id: 849, business_id_prefixes: [AE-SYS] }
  id_binding: adapteng-automation-platform config/company-operations.binding.env (non-secret numeric ids, captured on main via PR #77)

postgres_adapteng_ops:
  service: postgres-adapteng-ops (internal Coolify; SSL disabled on internal network)
  authority: operational truth — id allocation, lead reservation, run/approval ledger
  schemas: [public, integrity]
  migrations:
    - { file: 001_id_allocator.sql,               provides: "AE-* id allocator (public)",                      live: true,  applied: "adapter first boot (RUN_MIGRATIONS_ON_START)" }
    - { file: 002_run_ledger.sql,                 provides: "task/run/outcome ledger",                         live: false }
    - { file: 003_approval_outbox.sql,            provides: "approval ledger + outbox (hash-only tokens)",     live: false }
    - { file: 004_lead_identity.sql,              provides: "public.lead_identity_reservation + reserve_lead_identity()", live: true, applied: "2026-07-25 (WEB-002); function pins search_path=pg_catalog,public" }
    - { file: 005_ai_gateway.sql,                 provides: "AI gateway cost/run ledger",                      live: false }
    - { file: 006_integrity_projection_manifest.sql, provides: "integrity schema: projection_manifest + coverage_marker", live: false, note: "kept unapplied until backup/restore planning per ARCHITECTURE.md §11 + ADR-0011" }
    - { file: 007_source_identity_reservation.sql, provides: "canonical source identity to allocator-returned AE-CGR reservation", live: false, note: "repository-merged via automation PR #89; unapplied" }
    - { file: 008_drive_bridge_replay_reservations.sql, provides: "atomic governed Drive replay reservations", live: false, note: "repository-merged via automation PR #89; unapplied" }
  approved_source_import:
    repository_status: repo-merged-not-live
    repository_status_updated: 2026-07-29
    merge: "adapteng-automation-platform PR #89 / dbcf806ea7714b8e2a7415ae6cd788491924178d"
    reviewed_tree: 8fc649a97963f38ce0a7592001a7fea4834eceea
    permitted_migrations: [007_source_identity_reservation.sql, 008_drive_bridge_replay_reservations.sql]
    forbidden_migration: 008_ai_gateway_runtime_hardening.sql
    note: "No workflow dispatch or live database mutation occurred; repository readiness is not live readiness."
  backup:
    last_verified: "2026-07-25 13:31 (35.21 KB, Coolify local + owner download)"
    last_verified_contract_status: insufficient-logical-backup
    proposed_design: "pgBackRest physical base backup + continuous WAL, client-side encrypted to private Backblaze B2 EU Central; weekly full, daily differential, eight-full retention"
    proposed_design_status: documented-not-configured
    restore_design: "clean disposable Hetzner PostgreSQL-only server; no production snapshot/app clone; bootstrap egress only for restore/recovery, then locked before rehearsal SQL"
    acceptance: "fresh backup label + info JSON SHA-256; isolated restore; exact 007/Drive-008 apply; rollback restore; independent re-restore; digest-only reviewed PASS"
    forbidden_substitutes: [Coolify pg_dump, manual logical dump, Baserow all-in-one backup, running-server Hetzner snapshot]
    policy: no migration until the proposed design is configured and its acceptance passes; see runbooks/backup-and-restore.md

google_drive:
  authority: document / media evidence
  shared_drive:
    name: AdaptEng Company
    alias: company-drive://AdaptEng-Company
    link_policy: resolve governed aliases in Google Workspace; never store provider resource URLs in Git
    ownership: Google Workspace organization
  folders:
    - { name: 00_Case_Uploads, alias: "company-drive://00_Case_Uploads" }
    - { name: 01_Inbox, alias: "company-drive://01_Inbox" }
    - { name: 10_Company, alias: "company-drive://10_Company" }
    - { name: 20_Commercial, alias: "company-drive://20_Commercial" }
    - { name: 30_Projects_Cases, alias: "company-drive://30_Projects_Cases" }
    - { name: 40_Content, alias: "company-drive://40_Content" }
    - { name: 50_Templates, alias: "company-drive://50_Templates" }
    - { name: 90_Archive, alias: "company-drive://90_Archive" }
  usage_notes:
    task_id: drive-folder-usage-notes
    title: START HERE
    status: repository-contract-approved-live-placement-pending
    canonical_work_areas: [00_Case_Uploads, 01_Inbox, 10_Company, 20_Commercial, 30_Projects_Cases, 40_Content, 50_Templates, 90_Archive]
    generated_folder_patterns: [AE-CAS-NNNN_short-name, AE-CGR-NNNN_short-title]
    priority: [01_Inbox, 30_Projects_Cases folder contract, 40_Content folder contract]
    required_sections: [purpose, allowed/disallowed inputs, naming/required metadata, one placeholder-only correct example, current manual/live/planned automation, trigger/actions/output, approvals/PII, owner/version]
    logical_key: parent governed alias or generated-folder pattern + START HERE
    idempotency: create only when missing; keep exactly one note; update only the versioned managed section
    content_policy: no duplicates, secrets, credentials, assigned/live IDs including provider/resource IDs, live payloads or PII
    human_content_policy: never overwrite content outside the managed section; ambiguous duplicates or malformed markers fail closed
    live_placement: "separate approval and execution; PR #11 performs no live Drive write"
  status: live-folder-skeleton-read-verified
  last_verified: "2026-07-26 (sanctioned GitHub Actions dry run; drive + 8 folders EXISTS)"
  credentials:
    service_account_ref: GOOGLE_SERVICE_ACCOUNT_JSON_B64
    delegated_user_ref: GOOGLE_WORKSPACE_DELEGATED_USER
    approved_source_git_credentials: "named least-privilege read-only credentials required before preflight"
    legacy: n8n Cloud OAuth + old media-worker service account still bind current media/content workflows to personal My Drive
  approved_source_import:
    scope: "exact immutable ART-2026-001 / SRC-2026-001 three-JSON metadata package only"
    behavior: "allocator-returned AE-CGR identity; sealed upload; exact 2-folder/3-file replay verification; boolean/count-only receipts"
    excluded: [Baserow rows, AI generation/model calls, publication, media binaries, extra historical files, CASE-2026-001 media]
    live: false
    repository_status_updated: 2026-07-29
    rollout_readiness:
      environments_absent: [approved-assets-migrations, approved-assets-preflight, approved-assets-import]
      workflow_runs: 0
      required_secrets_absent: [APPROVED_ASSETS_DATABASE_URL, APPROVED_ASSETS_MIGRATION_EVIDENCE_JSON, MARKETING_CONTENTS_READ_TOKEN, COMPANY_OS_CONTENTS_READ_TOKEN, APPROVED_ASSETS_BASE_IDEMPOTENCY_KEY, CANONICAL_40_CONTENT_FOLDER_ID, GOOGLE_SERVICE_ACCOUNT_JSON_B64]
      required_variables_absent: [GOOGLE_CLOUD_PROJECT, GOOGLE_DRIVE_SCOPE]
      approved_source_delegated_user_variable: GOOGLE_WORKSPACE_ADMIN
      repository_variables_present: [GOOGLE_WORKSPACE_ADMIN]
      dispatch_safe: false
      note: "Read-only GitHub metadata only; no secret values or live provider access."
    backup_readiness: "Selected pgBackRest physical/WAL + B2 EU design is documented but not configured; the 2026-07-25 Coolify logical backup is insufficient. Fresh label/info digest, disposable isolated restore, exact 007/Drive-008 rehearsal, rollback restore, independent re-restore and reviewed digest-only PASS are absent."
    next_gates: "configure and accept the documented physical backup path; create environment-scoped least-privilege rollout configuration; zero-write preflight; reviewed expected writes; five-phase controlled run; zero-duplicate replay"
