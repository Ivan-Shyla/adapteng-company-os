precedence_notes:
  - A business fact's canonical owner is Postgres (ids/ledger), surfaced for humans in Baserow, with evidence in Drive.
  - Repository readiness is not live readiness; the approved-source import preserves Postgres operational truth, Drive artifact authority and Baserow human projection.
  - The integrity-reconciler (when enabled) compares an expected projection manifest against all three, read-only.
