    governance: idempotent upsert; skipped_human_owned protects human fields (e.g. health)
    status: live-active
    proven: 2026-07-25 (created AE-SYS-baserow-adapter, idempotent governed re-run, pure-internal, verified 503 on public)
    owner: Ivan

  - id: 05ytz5If9kHUOYuA
    name: WEB-002 Lead Intake (governed)
    runtime: self-hosted n8n (n8n.adapteng.com)
    trigger: webhook (header-authenticated, X-Webhook-Token; path secret)
    input_contract: lead.created v1 (source/consent/language/service/correlation id)
    pipeline: Validate -> reserve_lead_identity (Postgres) -> FetchRid -> build payloads -> 4x governed upsert (Organization, Person, Opportunity, one-day Action) -> Respond200
    idempotency: business_id derived from a stable Postgres reservation (public.lead_identity_reservation); retry-safe
    fail_closed: per-node error outputs route to Respond500 (HTTP 500) so a producer retries instead of silently losing a lead
    calls: adapteng-baserow-adapter (internal)
    writes: Baserow Organizations 842 / People 843 / Opportunities 844 / Actions 846
    status: live-active
    proven: 2026-07-25 (T1 create, T2 idempotent replay, T3 reservation conflict -> HTTP 409, T4 no-loss -> HTTP 500 -> clean retry; independent Baserow read-back, zero duplicates)
    owner: Ivan
    consumer_pending: website producer (automation-platform PR #78) is held; point it at this webhook when unheld.

  - id: 5f501c9b-f912-4a92-b822-ec57259c440c
    name: Weekly Company OS status
    runtime: app scheduled workflow (not n8n)
    trigger: schedule (Mondays 09:00 local)
