    name: AUT-001 Systems Registry (governed upsert)
    runtime: self-hosted n8n (n8n.adapteng.com)
    trigger: webhook (header-authenticated, X-Webhook-Token; path secret)
    calls: adapteng-baserow-adapter (internal http://adapteng-baserow-adapter:8080/v1/upsert)
