      result: "reconcile ok changed=yes pending_owner_env=3 unreported_settings=4"
      declared_keys_written_and_reread: 14
      verified: 2026-08-11
    pending_owner_held_values:
      # Names only. These are set on the resource by the owner, or by a run that
      # supplies them from a secret; their values never appear in a log or a file.
      - AI_GATEWAY_BEARER_TOKENS
      - AI_GATEWAY_DATABASE_URL      # blocked on the ai_gateway_runtime Postgres role
      - GOOGLE_APPLICATION_CREDENTIALS
    pending_owner_ui_settings:
