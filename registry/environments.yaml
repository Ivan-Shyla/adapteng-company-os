# AdaptEng Company OS — Environment Registry
# Production hosts, domains, platform and budgets. NO secrets — names/hostnames/ids only.
version: 1
updated: 2026-08-06

platform:
  compute: Hetzner (EU region) — single self-hosted host
  orchestrator: Coolify (self-hosted PaaS on Hetzner)
  container_network: coolify (internal; services reach each other by alias, no public exposure)
  policy: upgrade the existing host only after 7 days of measured CPU/RAM/disk pressure (ARCHITECTURE.md §9)

operator_access:
  production_host: 37.27.213.220
  ssh_user: adapteng-ai
  ssh_port: 22
  private_key_ref: PROD_SSH_PRIVATE_KEY
  host_verification_ref: PROD_SSH_KNOWN_HOSTS
  coolify_url_ref: COOLIFY_URL
  coolify_api_ref: COOLIFY_API_TOKEN
  verified: 2026-08-06
  note: "The production host accepted the managed adapteng-ai identity. Local owner-key filenames are not an authority; use the managed GitHub SSH identity or its verified local counterpart."

excluded_personal_projects:
  status: excluded-from-company-os
  projects: [Job Monitor / job-search, English Coach / English-learning, Kraken / personal trading]
  registry_evidence: aggregate exclusion and isolation evidence only
  operational_company_rows: prohibited for excluded personal projects, including Systems_Automations
  company_resources: "prohibited: company Shared Drive, Baserow, Postgres, n8n, AI employees, budgets and operational roadmap"
  self_hosted_company_cutover: prohibited
  separation: separate any shared credentials and store in place without copying personal data
  kraken_pattern_reuse: separately reviewed data-free generic patterns only

domains:
  - host: n8n.adapteng.com
    service: n8n-self-hosted
    tls: Let's Encrypt (valid to 2026-10-23)
    exposure: public UI/API + header-authenticated webhooks
  - host: baserow.adapteng.com
    service: baserow-self-hosted
    dns: A 37.27.213.220
    tls: Let's Encrypt (valid to 2026-10-23)
    exposure: public UI (login-gated)
  - host: adapteng-baserow-adapter:8080
    service: adapteng-baserow-adapter
    exposure: INTERNAL ONLY (coolify network alias; no public URL — verified 503 externally)

external_saas:
  - name: n8n Cloud
    role: current authority for legacy company MM/LM workflows; excluded Job Monitor and English Coach presence is aggregate boundary evidence only and has no Company OS cutover
    cost: paid/account-specific; record invoice before decommission decision
  - name: Cloudways WordPress
    role: live website + published content (adapteng-website)
    cost: paid/account-specific; record invoice
  - name: GoDaddy
    role: domain + DNS
    cost: paid/account-specific; record invoice/renewal
  - name: Zoho
    role: mail / SMTP (no Gmail migration)
    cost: paid/account-specific; record invoice/plan
  - name: Google Workspace (Business Standard)
    role: company documents + Shared Drive
    public_price_reference: ~EUR 13.80/user/month on annual commitment, excluding VAT (rechecked 2026-07-26)
    actual_cost_rule: invoice/VAT is authoritative
  - name: Google Cloud (Vertex AI + Drive API)
    project: adapteng-workspace-automation
    service_account: adapteng-ai-operator@adapteng-workspace-automation.iam.gserviceaccount.com
    delegation: domain-wide; scope https://www.googleapis.com/auth/drive (delegated to owner primary Workspace user)
    credential_ref: GOOGLE_SERVICE_ACCOUNT_JSON_B64  # Coolify runtime secret; value NEVER in repo
    delegated_user_ref: GOOGLE_WORKSPACE_DELEGATED_USER
    role: Credential authority for future governed Drive copy/artifact access; current main tooling is folder-only
    vertex_target_model: gemini-3.1-flash-lite
    vertex_availability: GA; supported in EU multi-region
    vertex_location: eu
    vertex_endpoint: https://aiplatform.eu.rep.googleapis.com
    status: credentials provided 2026-07-26; Drive implementation/review in progress, no controlled copy begun; Vertex AI User role/endpoint access not yet evidenced
  - name: GitHub
    role: code, contracts, architecture, evidence
    actions_budget: USD 10/month, hard stop enabled

budgets:
  ai_runtime_cap_eur_month: 10        # business_artifact runtime only (gateway drafts/classify/extract)
  ai_per_call_cap_eur: 0.10
  ai_per_day_cap_eur: 1
  dev_model_budget: owner subscription (code_change mode) — OUTSIDE the EUR 10 runtime cap
  evidenced_new_recurring_eur_month: 13.80  # Google Workspace; AI cap is fail-closed, not spend
  planned_not_purchased:
    - Hetzner Storage Box BX11 (~EUR 3.20/month) — backup/object storage, not yet purchased

regions_and_residency:
  data_residency: EU (compute in EU; AI model access via EU Vertex multi-region only — see ai/model-choices.md)

software_fee_classification:
  n8n_community_self_hosted: EUR 0 software fee; Hetzner infrastructure paid
  baserow_self_hosted_community: EUR 0 software fee; Hetzner infrastructure paid
  coolify_self_hosted: no incremental software fee evidenced; infrastructure paid
