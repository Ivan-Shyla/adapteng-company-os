# AdaptEng Company OS — Environment Registry
# Production hosts, domains, platform and budgets. NO secrets — names/hostnames/ids only.
version: 1
updated: 2026-08-11

platform:
  compute: Hetzner (EU region) — single self-hosted host
  orchestrator: Coolify (self-hosted PaaS on Hetzner)
  container_network: coolify (internal; services reach each other by alias, no public exposure)
  policy: upgrade the existing host only after 7 days of measured CPU/RAM/disk pressure (ARCHITECTURE.md §9)

operator_access:
  production_host: 37.27.213.220
  ssh_user: adapteng-ai
  ssh_port: 22
  private_key_ref: PROD_SSH_PRIVATE_KEY
  host_verification_ref: PROD_SSH_KNOWN_HOSTS
  coolify_url_ref: COOLIFY_URL
  coolify_api_ref: COOLIFY_API_TOKEN
  verified: 2026-08-06
  note: "The production host accepted the managed adapteng-ai identity. Local owner-key filenames are not an authority; use the managed GitHub SSH identity or its verified local counterpart."
  reachable_from:
    # Measured 2026-08-11, both directions of the same question.
    github_hosted_runner:
      ssh_22: false
      https_443: true
      evidence: "run 31500471689 - ssh: connect to host 37.27.213.220 port 22: Connection timed out, twice, on a runner whose Coolify API calls over 443 succeed from the same job"
    operator_workstation:
      ssh_22: true
      https_443: true
      evidence: "TCP connect succeeded to both ports from a permitted workstation on the same date"
    reading: >-
      The daemon is up and the address is right, so the difference is the source.
      Port 22 does not accept GitHub-hosted runners. No workflow in this
      repository had ever opened an SSH connection to this host before
      postgres-runtime-role.yml, so nothing regressed; the path had simply never
      been exercised.
    blocked: >-
      ~~scripts/postgres_runtime_role.py, and any future host-side workflow~~
      Lifted 2026-08-11. The block was real - run 31500471689 failed on the SSH
      timeout recorded above - but it is no longer a standing condition.
    resolved: >-
      The first option was taken, and implemented holding less authority than
      that option described. The operations runner is not installed on the
      host: it is a container deployed through Coolify onto the predefined
      Docker network, so it reaches the managed database at its internal
      address with no shell on the host, no Docker socket and no root. It
      cannot touch the host at all. Port 22 stays shut to the published runner
      ranges, and no credential moved onto a personal machine - which is what
      the three options were being weighed against.
    resolved_by: >-
      reconcile run 31514155983 (uuid o145rw7urft00qoj3y9vnrma) and deploy run
      31514210128 (deployment kd6zpavgo9j8624lddy3q39k), 2026-08-11
    runner:
      label: adapteng-ops
      registered_to: this repository alone
      status: online
      status_verified: >-
        run 31543437220, 2026-08-11T22:41Z, RESULT status ok runner=online,
        labels [Linux, X64, adapteng-ops, self-hosted]
      consumed_by: ".github/workflows/postgres-runtime-role.yml, runs-on: [self-hosted, adapteng-ops]"
    proof_the_block_lifted: >-
      postgres_runtime_role.py failed at 14:14Z on the SSH timeout, the runner
      came online at 16:47Z, and the same script has succeeded three times
      since - most recently run 31518891559, RESULT provision ok
      role=ai_gateway_runtime dsn_published=yes. That published DSN is what the
      gateway connects with, so this runner sits upstream of the readiness
      proof recorded further down this file.
    scope_limit: >-
      This unblocked host-network work, and nothing else. It was not needed for
      the readiness probe, which runs inside the application container through
      the Coolify scheduled-task API and needs no host access at all. Do not
      read this runner as a prerequisite for deploying or verifying the
      gateway; it is a prerequisite for reaching the database directly. Its
      reach is narrower than "on the coolify network" suggests: run 31531842811
      reports placement=runner_off_application_network, so it resolves the
      managed database and none of the running applications. That is why
      readiness is asked from inside the container rather than from here.

