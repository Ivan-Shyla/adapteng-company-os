      # Both found by reading platform main; recorded in control-plane/current-state.md section 5.
      # Neither is a defect: the defaults are safe, they simply must be overridden or
      # supplemented at deploy time, and that was previously written down nowhere.
      - must set AI_GATEWAY_HTTP_HOST=0.0.0.0 — the Dockerfile defaults to 127.0.0.1, which is unreachable from the container network, so the health check cannot pass
      - /health is liveness only — it returns ok without touching PostgreSQL, so a green health check does not prove database or budget accounting readiness; a separate readiness check is required
