created_not_yet_deployed:
  # Production resources whose Coolify application EXISTS and whose configuration
  # has been converged and re-read, but which have never been released. Presence
  # here is evidence of a configured resource, never of a running service.
  - resource: ai-gateway
    service: ai-gateway            # registry/services.yaml
    repo: adapteng-automation-platform
    path: services/ai-gateway
    target_runtime: Coolify (Hetzner), internal-only on the coolify network
    intended_exposure: INTERNAL ONLY — no public URL, reached by container alias like the Baserow adapter
    exists_in_production: true
    coolify_app_uuid: e13v7c6zjof7dmcpywqbyas3
    coolify_project: adapteng-ops (phhk1euleikwkegtr97hexi6)
    coolify_environment: production
    coolify_destination: c3dnc3udkoenz9zhw148mbu0   # the destination adapteng-baserow-adapter and n8n-selfhosted use
    source: GitHub App adapteng-coolify (the platform repository is private, so the public-repo source cannot read it)
    endpoint: internal only — no public URL; reached on the coolify network as the container alias
    application_status: "running:unknown — running, with Coolify's own health verdict unknown because the container gate is still the command-based one; the container's readiness was proved directly instead, below"
    state: created, configured, deployed and answering /ready
    creation_evidence:
      run: 31496735683
      created: "2026-08-11T13:33Z"
      declared_by: deploy/ai-gateway.json
      note: "The run that created it then failed, because this Coolify version reports no delivery-flag settings and the driver refused to claim an unverifiable write. The application was created before that abort; nothing was deployed."
    configuration_evidence:
      run: 31497863819
      completed: "2026-08-11T13:45Z"
      result: "reconcile ok changed=yes pending_owner_env=3 unreported_settings=4"
      declared_keys_written_and_reread: 14
      verified: 2026-08-11
    pending_owner_held_values:
      # Empty by measurement, not by assumption. See owner_held_values_bound.
      []
    owner_held_values_bound:
      # All three are bound on the application. Each moved here on evidence and
      # the evidence differs, so what each one proves is recorded with it.
      #
      # AI_GATEWAY_DATABASE_URL: proved working, not merely present. /ready
      # opens a database connection where /health does not (see
      # known_deployment_requirements below, read from platform main), and
      # /ready answered 200 from inside the container. A wrong or absent DSN
      # cannot produce that answer.
      #
      # AI_GATEWAY_BEARER_TOKENS and GOOGLE_APPLICATION_CREDENTIALS: reported
      # present on the resource by ai_gateway_credentials.py status, run
      # 31543126097, "RESULT status ok credentials=bound" - the storage
      # /secrets/vertex-service-account.json is present and both environment
      # keys are set. Present is not the same as correct: a secret cannot be
      # read back from either store, by design, so this is binding confirmed
      # and not value verified. The first live model call is what would prove
      # the Vertex key, and it is held for the owner's GO.
      #
      # The caller credential was generated by automation rather than handed
      # over: ai_gateway_credentials.py mint-caller mints it, writes it to the
      # Coolify environment and to a repository secret from one value in
      # memory so the two cannot disagree, and never prints, returns or logs
      # it.
      - AI_GATEWAY_DATABASE_URL
      - AI_GATEWAY_BEARER_TOKENS
      - GOOGLE_APPLICATION_CREDENTIALS
    managed_database:
      # Read from the instance on 2026-08-11, not assumed. The address half of
      # internal_db_url is recorded; the credential half of that same string is
      # not, and is never read into this repository.
      uuid: pgdgbwzsuuxhw55g8v5opjgn
      name: adapteng-ops-db
      image: postgres:16
      status: running:healthy
      internal_address: pgdgbwzsuuxhw55g8v5opjgn:5432/adapteng_ops
      database: adapteng_ops
      owner_role: adapteng_ops
      is_public: false
      reachable_by: >-
        Not from the public internet and not from a GitHub-hosted runner. The
        dedicated operations runner reaches it, resolving it to 10.0.1.7, which
        is the whole reason that runner was deployed as a container rather than
        installed on the host. Note the limit measured in run 31531842811: the
        runner shares this database's network but not the network the
        applications are placed on, and resolves none of them - not even
        itself. A database is placed by a different code path from an
        application, so reaching this address says nothing about reaching the
        gateway.
      enable_ssl: false
      ssl_mode_reported: require
      dsn_host_variable: AI_GATEWAY_PG_DSN_HOST
      resolved: >-
        Settled from the network contract, not from either document. recon
        connected to production Postgres and read pg_stat_ssl, and the server
        answered 'false none none': the connection is not encrypted and no TLS
        is on offer. enable_ssl=false is the true one; ssl_mode=require is the
        name that does not mean what it suggests.
      resolved_by: PR #120 (b6423fe), 2026-08-11
      acted_on: >-
        Recording the answer was not enough. libpq does not degrade a DSN
        declaring require or verify-full against a server without TLS, it
        refuses to connect, so publishing a demanding mode would have produced a
        correct role, a successful provision and a gateway that cannot start -
        everything reporting success except the thing that matters. The
        published mode is prefer, which this server can honour and which
        upgrades by itself if TLS is ever enabled. provision re-measures the
        transport on every run and refuses to publish any demanding mode it has
        not observed being satisfied, including when the measurement is
        unreadable - undetermined is not permission to assume.
    pending_owner_ui_settings:
      # This Coolify version reports these nowhere on the application resource, so
      # a write to them could not be verified and the driver does not attempt one.
      # deploy/ai-gateway.json records why leaving each unset is safe.
      - is_auto_deploy_enabled
      - is_preview_deployments_enabled
      - is_force_https_enabled
      - connect_to_docker_network
    test_evidence:
      run: 31214858400
      workflow: "AI Gateway Tests"
      branch: main
      head: d6ab6322983af42e355dedea4de6d0d21752de59
      completed: "2026-08-07T20:12:40Z"
      conclusion: success
      jobs_green: [ai-gateway unit tests (ubuntu-latest), ai-gateway unit tests (windows-latest), ai-gateway postgres semantics, ai-gateway supply-chain gates, repo validation]
      verified: 2026-08-10
    database_dependency: postgres-adapteng-ops — migrations 005 and 008_ai_gateway_runtime_hardening.sql are ALREADY APPLIED in production per the owner's post-rollout manual production check; DO NOT REPLAY them at deploy time
    not_blocked_by: [cost, model pricing, FX configuration, Coolify application creation]
    known_deployment_requirements:
      # Both found by reading platform main; recorded in control-plane/current-state.md section 5.
      # Neither is a defect: the defaults are safe, they simply must be overridden or
      # supplemented at deploy time, and that was previously written down nowhere.
      - must set AI_GATEWAY_HTTP_HOST=0.0.0.0 — the Dockerfile defaults to 127.0.0.1, which is unreachable from the container network, so the health check cannot pass
      - /health is liveness only — it returns ok without touching PostgreSQL, so a green health check does not prove database or budget accounting readiness; a separate readiness check is required
    blocking: "nothing in this repository — the remaining work is the owner's GO for the first live model call, then proving the EU Vertex client, Drive adapters, orchestration and canonical approval composition against the running service"
    budget_binding: budgets.ai_runtime_cap_eur_month (fail-closed cap, not evidenced spend)
    model_binding: external_saas "Google Cloud (Vertex AI + Drive API)" — gemini-3.1-flash-lite, location eu
    deployment_evidence:
      deployed: true
      readiness: "/ready answered 200 from inside the container"
      how: >-
        Not asked from outside, because nothing outside can reach it: the
        application is internal-only on the coolify network and the database
        refuses every route a runner has. The probe runs as a Coolify scheduled
        task inside the container itself, and its recorded execution message is
        the answer. The task is armed for the run and returned to rest
        afterwards - disabled, and scheduled for a leap day.
      proof_runs:
        - run: 31542579590
          operation: verify
          completed: "2026-08-11T22:29Z"
          result: "verify ok ready=yes answer=200"
          execution: "2026-08-11T22:29:01Z status=success message=ADAPTENG_READY 200"
        - run: 31540027132
          operation: diagnose
          completed: "2026-08-11T21:54Z"
          result: >-
            four executions recorded, every one status=success with
            ADAPTENG_READY 200, corroborated independently by four
            "GET /ready HTTP/1.1" 200 lines in the container's own access log
      what_it_does_and_does_not_prove: >-
        /ready opens a database connection where /health does not, so a 200 is
        the database proof and the runtime DSN is in place and usable. It says
        nothing about the other two credentials and nothing about model access:
        both endpoints answer before the Authorization header is read, and no
        model is called. Those two are confirmed bound separately, by
        ai_gateway_credentials.py status, which reports presence and shape
        because a secret cannot be read back from either store. Bound is not
        the same as correct - the first live model call is what would prove the
        Vertex key, and it is held for the owner's GO. Vertex inference calls
        remain 0.
      earlier_claim_was_wrong: >-
        This field read "NONE - the application has never been deployed" while
        four successful readiness executions were already recorded against it.
        The mistake was in the instrument, not the deployment: verify ranked
        executions by an id that this Coolify instance always returns as null,
        so no row ever counted as new and the tool reported
        ready=undetermined reason=no_execution. Fixed and pinned by a
        regression test in PR #132.
    declared: 2026-08-10
    created: 2026-08-11
    deployed: 2026-08-11

