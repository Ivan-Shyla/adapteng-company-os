# provider consoles and are referenced by name. Canonical status: ARCHITECTURE.md §11.
# status vocabulary:
#   live                     - running in production and proven
#   infra-live-not-cutover   - infrastructure runs, but not yet the authority
#   live-partial-authority   - production workload runs here, but other domains remain on a legacy authority
