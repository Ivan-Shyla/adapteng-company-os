  - id: ai-dev-loop-control-plane
    repo: ai-dev-loop-control-plane
    role: Generic agent admission/execution/evidence/validation/review lifecycle (code mode + business-artifact mode). This is "our AI agent".
    runtime: container (Coolify acceptance proven AG-006)
    source_of_truth_for: agent run lifecycle + evidence envelope
    status: repo-merged-not-live
