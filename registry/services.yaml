    owner: Ivan
    notes: PR #71 merged. Migration 005 NOT live-applied. Needs real EU Vertex client + GCP service account + FX config. See ai/model-choices.md and decisions/ (ADR-0010 in automation-platform).

  - id: integrity-reconciler
    repo: adapteng-automation-platform
    path: services/integrity-reconciler
    role: Read-only, offline, all-or-nothing drift detection across Postgres/Baserow/Drive vs an expected projection manifest. PII-minimized findings.
    runtime: offline CLI (no live schedule by design)
    source_of_truth_for: none (never writes; findings require human review)
    depends_on: [postgres-adapteng-ops (migration 006 integrity schema)]
    status: repo-merged-not-live
    owner: Ivan
    notes: PR #74 merged. ADR-0011 defers live schedule, Finding->Action adapter, n8n workflow, live manifest wiring and deployed credentials to future approved PRs; writes are forbidden forever. Full live run also needs Drive service-account creds. See owner/action-items.md.

