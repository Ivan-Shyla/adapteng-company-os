# AdaptEng Company OS — Service Registry
# Index only. No secrets, no PII, no code copies. Secret VALUES live in Coolify /
# provider consoles and are referenced by name. Canonical status: ARCHITECTURE.md §11.
# status vocabulary:
#   live                     - running in production and proven
#   infra-live-not-cutover   - infrastructure runs, but not yet the authority
#   live-partial-authority   - production workload runs here, but other domains remain on a legacy authority
#   live-legacy-binding      - production service is up but still uses a credential/data binding scheduled for cutover
#   repo-merged-not-live     - code merged to main, no live deploy/wiring yet
#   planned                  - designed, not built
version: 1
updated: 2026-07-27

services:
  - id: adapteng-website
    repo: adapteng-website
    path: wp-content/themes/adapteng + wp-content/plugins/adapteng-core
    role: Public website, Fluent Forms lead capture and published content.
    runtime: Cloudways WordPress
    endpoint: https://adapteng.com
    source_of_truth_for: published website content + persisted Fluent Forms entries
    depends_on: [Cloudways WordPress/PHP/MySQL, Fluent Forms, Slim SEO, Zoho SMTP]
    status: live
    producer_pr: adapteng-website#78
    producer_reviewed_head: b0e3a656cf6659b893810e11a15b9f515527ab79
    producer_status: draft-unmerged-undeployed-cutover-unproven
    legacy_snapshot:
      repository: PalinaRuban/adapteng
      classification: personal-account June-2026 WordPress/Azure snapshot; no active or authoritative production role
      active_public_path: separate nginx/Cloudways deployment
      runtime_evidence: legacy Azure hostname no longer resolves; last deployment workflow failed
      retain: [custom theme, brand/license provenance, historical runbook]
      migrate_from_live: structured approved business knowledge from current CMS/database
      exclude: [WordPress core, plugins, runtime, credentials, PII]
      security_gap: tracked wp-config.php has DB settings/auth salts; stale repository publish-profile secret/workflow and Zoho app password in DB/export require rotation
      containment: separate PR removes tracked wp-config.php/deploy workflow and adds archive/rotation guardrails; no history rewrite yet
      archive_gate: fresh encrypted current CMS/database/media export plus company ownership transfer
    owner: Ivan
    notes: >-
      Changes under wp-content auto-deploy from main. Reviewed PR #78 draft head
      b0e3a656cf6659b893810e11a15b9f515527ab79 implements the randomized
      /webhook/web002-lead-<8 lowercase hex> allowlist, X-Webhook-Token,
      identity-only durable mode-bound outbox, legacy-default flat MM-18
      compatibility, transport/5xx retry, 409 terminal identity review and
      other-4xx terminal configuration/validation handling. It remains draft,
      unmerged and undeployed. Actual WordPress/Fluent Forms producer T1-T4,
      atomic no-dual-write cutover, seven-day reconciliation, rollback proof and
      MM-18 retirement remain unproven. Model-provider legal placeholders stay
      unpublished.

