name: AI Gateway credentials

# Binds the two pieces of secret material the AI Gateway needs to run.
#
# Neither value is ever printed, returned or written to disk here. The Vertex
# service-account key already exists as a repository secret and is passed by
# reference into a Coolify file storage. The caller credential is generated in
# this job and written to two stores from one value in memory, so the gateway
# and its callers cannot disagree about what it is.
#
# bind-adc mounts the key and only then sets the variable naming its path,
# because the service fails closed at boot when that variable points at a file
# it cannot read. Setting it first would convert a missing mount into a crash
# loop. status reports what is bound by presence and shape, never by value.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "status reads only; bind-adc mounts the key; mint-caller generates the caller credential"
        required: true
        default: status
        type: choice
        options:
          - status
          - bind-adc
          - mint-caller

permissions:
  contents: read

# One at a time. Two overlapping mints would each write a credential the other
# is about to overwrite, and the gateway would end up holding one while the
# repository secret held the other.
concurrency:
  group: ai-gateway-credentials
  cancel-in-progress: false

jobs:
  drive:
    name: Credentials ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.11"

      - name: Bind the gateway credentials
        env:
          OPERATION: ${{ inputs.operation }}
          COOLIFY_API_CREDENTIAL: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_URL }}
          VERTEX_SERVICE_ACCOUNT_MATERIAL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # No GitHub credential is passed. This job once wrote the caller
          # credential into a repository secret and needed an administrative
          # token for it; it now writes only to Coolify, so handing it a token
          # able to administer this repository would be exposure bought for
          # nothing. GITHUB_REPOSITORY stays because the operations still name
          # the repository they act for.
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ai_gateway_credentials.py "$OPERATION"
