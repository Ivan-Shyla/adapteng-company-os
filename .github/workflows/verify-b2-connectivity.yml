name: Verify B2 connectivity

# A write/read/delete round trip against the backup object store, on demand only.
#
# This proves the three things the backup path depends on before any of it is
# built: the credentials authenticate, the bucket accepts writes, and deletes
# actually delete. The last one matters most and is the easiest to assume --
# retention is unenforceable if delete silently does nothing, and Object Lock
# left enabled would produce exactly that failure while every write still
# succeeded.
#
# Nothing here touches PostgreSQL, and nothing here restores anything. The probe
# object is written outside the pgBackRest repository path so it can never be
# mistaken for repository content by a later expire.
#
# No value is hardcoded. Bucket, endpoint and region are read from repository
# variables and the credentials from repository secrets, so this file stays free
# of live resource identifiers and the configuration has exactly one home.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-b2-connectivity
  cancel-in-progress: false

jobs:
  round-trip:
    name: Object store round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout step: every input arrives through the environment, so the job
    # needs no repository content and is given none.
    steps:
      - name: Verify the configuration contract is complete
        env:
          REPO1_S3_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          REPO1_S3_KEY_SECRET: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          REPO1_CIPHER_PASS: ${{ secrets.PGBACKREST_REPO1_CIPHER_PASS }}
          REPO1_TYPE: ${{ vars.PGBACKREST_REPO1_TYPE }}
          REPO1_S3_BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          REPO1_S3_ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          REPO1_S3_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          REPO1_S3_KEY_TYPE: ${{ vars.PGBACKREST_REPO1_S3_KEY_TYPE }}
          REPO1_S3_URI_STYLE: ${{ vars.PGBACKREST_REPO1_S3_URI_STYLE }}
          REPO1_PATH: ${{ vars.PGBACKREST_REPO1_PATH }}
          REPO1_CIPHER_TYPE: ${{ vars.PGBACKREST_REPO1_CIPHER_TYPE }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            REPO1_S3_KEY REPO1_S3_KEY_SECRET REPO1_CIPHER_PASS \
            REPO1_TYPE REPO1_S3_BUCKET REPO1_S3_ENDPOINT REPO1_S3_REGION \
            REPO1_S3_KEY_TYPE REPO1_S3_URI_STYLE REPO1_PATH REPO1_CIPHER_TYPE
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error title=Incomplete backup configuration::Missing: %s\n' "${missing[*]}"
            exit 1
          fi

          # The endpoint must be a host name. A bare region here resolves to
          # nothing, and every later pgBackRest call would fail with a DNS error
          # that looks like a network problem rather than a configuration one.
          case "$REPO1_S3_ENDPOINT" in
            *.*) ;;
            *)
              echo "::error title=Endpoint is not a host name::PGBACKREST_REPO1_S3_ENDPOINT must be a host name, not a region."
              exit 1
              ;;
          esac

          # The repository path is what separates backup content from everything
          # else in the bucket, so an unanchored value is rejected rather than
          # silently reinterpreted as relative to the bucket root.
          case "$REPO1_PATH" in
            /*) ;;
            *)
              echo "::error title=Repository path is not absolute::PGBACKREST_REPO1_PATH must start with a slash."
              exit 1
              ;;
          esac

          echo "Configuration contract complete: 3 secrets and 8 variables present."

      - name: Write, read back and delete a probe object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          AWS_DEFAULT_OUTPUT: json
          BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          PROBE_KEY: connectivity-check/${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set -euo pipefail
          endpoint="https://$ENDPOINT"
          sent="$RUNNER_TEMP/probe-sent.txt"
          received="$RUNNER_TEMP/probe-received.txt"
          printf 'adapteng b2 connectivity probe run=%s attempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$sent"

          echo "--- write ---"
          aws s3api put-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" \
            --body "$sent" >/dev/null
          echo "Wrote $PROBE_KEY"

          echo "--- read ---"
          aws s3api get-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" \
            "$received" >/dev/null
          # Comparing bytes rather than trusting a 200: a read that returns the
          # wrong object would still be a successful HTTP call.
          cmp "$sent" "$received"
          echo "Read back $(wc -c <"$received" | tr -d ' ') bytes, identical to what was written."

          echo "--- delete ---"
          aws s3api delete-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" >/dev/null

          # Asserted, not assumed. If Object Lock were enabled the write and the
          # delete would both report success while the object survived, and
          # retention would be quietly unenforceable.
          if aws s3api head-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" >/dev/null 2>&1
          then
            echo "::error title=Probe object survived deletion::Delete reported success but the object is still present, so retention cannot be enforced."
            exit 1
          fi
          echo "Probe object is gone."
          echo "Write, read and delete all work against the backup bucket."

      - name: Classify the refusal by transaction class
        # Always, because this step is at its most useful exactly when the round
        # trip above has just failed. A single "403" says the object store said
        # no; it does not say to what. Backblaze B2 meters uploads (Class A),
        # downloads (Class B) and listings (Class C) separately and caps them
        # separately, so "the credentials are broken" and "the download cap is
        # spent" are the same status code and completely different repairs.
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          AWS_DEFAULT_OUTPUT: json
          REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Deliberately not `set -e`. Every probe below must run even after one
          # of them is refused, because the shape of the refusal across all
          # three classes is the measurement; stopping at the first failure
          # would destroy it.
          set -uo pipefail
          endpoint="https://$ENDPOINT"
          present="connectivity-check/${SCOPE}-classify.txt"
          absent="connectivity-check/${SCOPE}-absent.txt"
          # Shaped exactly like the first repository object pgBackRest asks for
          # during stanza-create, so this probe and that call differ in nothing
          # but the client making them.
          repository_shaped="restore-rehearsal/${SCOPE}/archive/rehearsal/archive.info"
          body="$RUNNER_TEMP/classify-body.txt"
          readback="$RUNNER_TEMP/classify-readback.txt"
          printf 'transaction class probe %s\n' "$SCOPE" >"$body"
          refused=0

          # A probe that must succeed. Its failure is a refusal.
          allow() {
            label="$1"; class="$2"; shift 2
            if output="$("$@" 2>&1)"; then
              printf '  %-7s  %-38s  ALLOWED\n' "$class" "$label"
              return 0
            fi
            printf '  %-7s  %-38s  REFUSED  %s\n' "$class" "$label" \
              "$(printf '%s' "$output" | tr '\n' ' ')"
            refused=$((refused + 1))
          }

          # A probe on a key that does not exist. Not-found is the healthy
          # answer; forbidden is a refusal wearing the same status family.
          expect_absent() {
            label="$1"; class="$2"; shift 2
            if output="$("$@" 2>&1)"; then
              printf '  %-7s  %-38s  UNEXPECTEDLY PRESENT\n' "$class" "$label"
              return 0
            fi
            if printf '%s' "$output" | grep -qE '\(404\)|Not Found'; then
              printf '  %-7s  %-38s  ABSENT (404, healthy)\n' "$class" "$label"
              return 0
            fi
            printf '  %-7s  %-38s  REFUSED  %s\n' "$class" "$label" \
              "$(printf '%s' "$output" | tr '\n' ' ')"
            refused=$((refused + 1))
          }

          echo "--- the same credential, one probe per transaction class ---"
          allow "list the probe prefix" "Class C" \
            aws s3api list-objects-v2 --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --prefix 'connectivity-check/' --max-items 1
          allow "upload an object" "Class A" \
            aws s3api put-object --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --key "$present" --body "$body"
          # The positive control for every Class B line below it: a download of
          # an object this run has just proven exists. Without it, "downloads
          # are refused" would be indistinguishable from "there was nothing to
          # download".
          allow "download the object just uploaded" "Class B" \
            aws s3api get-object --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --key "$present" "$readback"
          allow "head the object just uploaded" "Class B" \
            aws s3api head-object --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --key "$present"
          expect_absent "head a key that does not exist" "Class B" \
            aws s3api head-object --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --key "$absent"
          expect_absent "head the key stanza-create asks for" "Class B" \
            aws s3api head-object --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --key "$repository_shaped"
          allow "delete the object just uploaded" "Class A" \
            aws s3api delete-object --endpoint-url "$endpoint" \
              --bucket "$BUCKET" --key "$present"

          echo
          if [ "$refused" -eq 0 ]; then
            echo "No transaction class is refused: uploads, downloads and listings all work."
            exit 0
          fi

          # Only spent on a refusal. Downloads are themselves a metered class,
          # so an unconditional probe here would consume the resource it is
          # trying to report on.
          echo "--- the response body pgBackRest is unable to show ---"
          # pgBackRest's first repository call is a HEAD, and a HEAD response
          # carries no body by protocol, so the provider's explanation is
          # discarded before pgBackRest can log it -- which is why the rehearsal
          # can only report a bare status code. The identical request issued as
          # a GET takes the same authorization decision and does return the
          # body, so this is where the reason actually becomes readable. Both
          # are issued here, in that order, so the difference is on the record.
          umask 077
          curlrc="$RUNNER_TEMP/classify.curlrc"
          printf 'user = "%s:%s"\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >"$curlrc"
          for method in HEAD GET; do
            printf '\n%s https://%s/%s\n' "$method" "$BUCKET.$ENDPOINT" "$repository_shaped"
            head_only=()
            [ "$method" = HEAD ] && head_only=(--head)
            curl --config "$curlrc" --silent --show-error "${head_only[@]}" \
              --aws-sigv4 "aws:amz:${REGION}:s3" \
              --write-out '\n<<HTTP %{http_code}, %{size_download} body bytes read>>\n' \
              "https://$BUCKET.$ENDPOINT/$repository_shaped" || true
          done
          rm -f "$curlrc"

          echo
          echo "::error title=Object store refused $refused probe(s)::A class the backup depends on is refused. The per-class table above says which one, and the response body above says why."
          exit 1

      - name: Remove the probe objects if the round trip did not
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          PROBE_KEY: connectivity-check/${{ github.run_id }}-${{ github.run_attempt }}.txt
          CLASSIFY_KEY: connectivity-check/${{ github.run_id }}-${{ github.run_attempt }}-classify.txt
        run: |
          # A failure between write and delete would otherwise leave litter in a
          # bucket whose whole purpose is to contain exactly one known thing.
          for key in "$PROBE_KEY" "$CLASSIFY_KEY"; do
            aws s3api delete-object \
              --endpoint-url "https://$ENDPOINT" --bucket "$BUCKET" --key "$key" \
              >/dev/null 2>&1 || true
          done
