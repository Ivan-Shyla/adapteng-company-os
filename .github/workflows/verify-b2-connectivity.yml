name: Verify B2 connectivity

# A write/read/delete round trip against the backup object store, on demand only.
#
# This proves the three things the backup path depends on before any of it is
# built: the credentials authenticate, the bucket accepts writes, and deletes
# actually delete. The last one matters most and is the easiest to assume --
# retention is unenforceable if delete silently does nothing, and Object Lock
# left enabled would produce exactly that failure while every write still
# succeeded.
#
# Nothing here touches PostgreSQL, and nothing here restores anything. The probe
# object is written outside the pgBackRest repository path so it can never be
# mistaken for repository content by a later expire.
#
# No value is hardcoded. Bucket, endpoint and region are read from repository
# variables and the credentials from repository secrets, so this file stays free
# of live resource identifiers and the configuration has exactly one home.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-b2-connectivity
  cancel-in-progress: false

jobs:
  round-trip:
    name: Object store round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout step: every input arrives through the environment, so the job
    # needs no repository content and is given none.
    steps:
      - name: Verify the configuration contract is complete
        env:
          REPO1_S3_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          REPO1_S3_KEY_SECRET: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          REPO1_CIPHER_PASS: ${{ secrets.PGBACKREST_REPO1_CIPHER_PASS }}
          REPO1_TYPE: ${{ vars.PGBACKREST_REPO1_TYPE }}
          REPO1_S3_BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          REPO1_S3_ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          REPO1_S3_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          REPO1_S3_KEY_TYPE: ${{ vars.PGBACKREST_REPO1_S3_KEY_TYPE }}
          REPO1_S3_URI_STYLE: ${{ vars.PGBACKREST_REPO1_S3_URI_STYLE }}
          REPO1_PATH: ${{ vars.PGBACKREST_REPO1_PATH }}
          REPO1_CIPHER_TYPE: ${{ vars.PGBACKREST_REPO1_CIPHER_TYPE }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            REPO1_S3_KEY REPO1_S3_KEY_SECRET REPO1_CIPHER_PASS \
            REPO1_TYPE REPO1_S3_BUCKET REPO1_S3_ENDPOINT REPO1_S3_REGION \
            REPO1_S3_KEY_TYPE REPO1_S3_URI_STYLE REPO1_PATH REPO1_CIPHER_TYPE
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error title=Incomplete backup configuration::Missing: %s\n' "${missing[*]}"
            exit 1
          fi

          # The endpoint must be a host name. A bare region here resolves to
          # nothing, and every later pgBackRest call would fail with a DNS error
          # that looks like a network problem rather than a configuration one.
          case "$REPO1_S3_ENDPOINT" in
            *.*) ;;
            *)
              echo "::error title=Endpoint is not a host name::PGBACKREST_REPO1_S3_ENDPOINT must be a host name, not a region."
              exit 1
              ;;
          esac

          # The repository path is what separates backup content from everything
          # else in the bucket, so an unanchored value is rejected rather than
          # silently reinterpreted as relative to the bucket root.
          case "$REPO1_PATH" in
            /*) ;;
            *)
              echo "::error title=Repository path is not absolute::PGBACKREST_REPO1_PATH must start with a slash."
              exit 1
              ;;
          esac

          echo "Configuration contract complete: 3 secrets and 8 variables present."

      - name: Write, read back and delete a probe object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          AWS_DEFAULT_OUTPUT: json
          BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          PROBE_KEY: connectivity-check/${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set -euo pipefail
          endpoint="https://$ENDPOINT"
          sent="$RUNNER_TEMP/probe-sent.txt"
          received="$RUNNER_TEMP/probe-received.txt"
          printf 'adapteng b2 connectivity probe run=%s attempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$sent"

          echo "--- write ---"
          aws s3api put-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" \
            --body "$sent" >/dev/null
          echo "Wrote $PROBE_KEY"

          echo "--- read ---"
          aws s3api get-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" \
            "$received" >/dev/null
          # Comparing bytes rather than trusting a 200: a read that returns the
          # wrong object would still be a successful HTTP call.
          cmp "$sent" "$received"
          echo "Read back $(wc -c <"$received" | tr -d ' ') bytes, identical to what was written."

          echo "--- delete ---"
          aws s3api delete-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" >/dev/null

          # Asserted, not assumed. If Object Lock were enabled the write and the
          # delete would both report success while the object survived, and
          # retention would be quietly unenforceable.
          if aws s3api head-object \
            --endpoint-url "$endpoint" --bucket "$BUCKET" --key "$PROBE_KEY" >/dev/null 2>&1
          then
            echo "::error title=Probe object survived deletion::Delete reported success but the object is still present, so retention cannot be enforced."
            exit 1
          fi
          echo "Probe object is gone."
          echo "Write, read and delete all work against the backup bucket."

      - name: Remove the probe object if the round trip did not
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          PROBE_KEY: connectivity-check/${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          # A failure between write and delete would otherwise leave litter in a
          # bucket whose whole purpose is to contain exactly one known thing.
          aws s3api delete-object \
            --endpoint-url "https://$ENDPOINT" --bucket "$BUCKET" --key "$PROBE_KEY" \
            >/dev/null 2>&1 || true

  operation-classes:
    name: Which operations the key can actually perform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The round-trip job above answers "do the credentials work". That turned
    # out to be too coarse: on 2026-08-03 the backup rehearsal began failing at
    # `pgbackrest stanza-create` with HTTP 403 on a HEAD, in runs where listing
    # and deleting through the same key in the same job still succeeded. A
    # single pass/fail for "connectivity" cannot describe that, so this job
    # classifies each operation the backup path depends on separately.
    #
    # Object stores charge and permission reads, writes and listings
    # differently, so "the credentials work" is not one fact but several, and
    # the backup path needs all of them.
    steps:
      - name: Classify every operation the backup path depends on
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          AWS_DEFAULT_OUTPUT: json
          BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
        run: |
          # Deliberately no `set -e`. Every command here is a measurement and a
          # failure is a result, not an accident.
          set -uo pipefail

          scope="operation-class-probe/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          present_key="$scope/present.txt"
          absent_key="$scope/absent.txt"
          body="$RUNNER_TEMP/response.xml"
          payload="$RUNNER_TEMP/payload.txt"
          printf 'operation class probe\n' >"$payload"

          # Credentials are fed to curl through a config file on stdin so they
          # never appear in a process argument list.
          signed() {
            local method="$1" url="$2"
            local -a verb
            if [ "$method" = HEAD ]; then verb=(--head); else verb=(--request "$method"); fi
            printf '%s\n' \
              "user = \"$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY\"" \
              "aws-sigv4 = \"aws:amz:$REGION:s3\"" \
              | curl --silent --show-error --config - "${verb[@]}" \
                  --output "$body" --write-out '%{http_code}' "$url"
          }

          report() {
            local label="$1" method="$2" url="$3"
            local status
            status=$(signed "$method" "$url")
            printf '\n=== %s\n' "$label"
            printf '    %s -> HTTP %s\n' "$method" "$status"
            # A HEAD response carries no body by definition, which is exactly
            # why the failing pgBackRest log could show a content-length for an
            # XML error it never received. Only GET can show the reason.
            if [ "$method" != HEAD ] && [ -s "$body" ]; then
              echo "    --- response body verbatim ---"
              sed 's/^/    /' "$body"
              printf '\n    --- end of body ---\n'
            fi
            printf '%s %s\n' "$label" "$status" >>"$RUNNER_TEMP/classification.txt"
          }

          virtual="https://$BUCKET.$ENDPOINT"
          path="https://$ENDPOINT/$BUCKET"
          : >"$RUNNER_TEMP/classification.txt"

          echo "### Writing one probe object, so that a read of something that exists can be told"
          echo "### apart from a read of something that does not."
          aws s3api put-object --endpoint-url "https://$ENDPOINT" \
            --bucket "$BUCKET" --key "$present_key" --body "$payload" >/dev/null 2>&1
          echo "awscli put-object exit: $?"

          report "head-present-virtual"  HEAD "$virtual/$present_key"
          report "get-present-virtual"   GET  "$virtual/$present_key"
          report "head-absent-virtual"   HEAD "$virtual/$absent_key"
          report "get-absent-virtual"    GET  "$virtual/$absent_key"
          report "get-absent-path"       GET  "$path/$absent_key"
          report "list-prefix-virtual"   GET  "$virtual/?list-type=2&prefix=$scope/"

          echo ""
          echo "### The same operations through the AWS CLI, which is the client that"
          echo "### succeeds inside the failing rehearsal job."
          for op in "head-object --key $present_key" "head-object --key $absent_key"; do
            printf '\n=== awscli %s\n' "$op"
            # shellcheck disable=SC2086
            aws s3api $op --endpoint-url "https://$ENDPOINT" --bucket "$BUCKET" 2>&1 \
              | sed 's/^/    /'
          done
          printf '\n=== awscli list-objects-v2\n'
          aws s3api list-objects-v2 --endpoint-url "https://$ENDPOINT" \
            --bucket "$BUCKET" --prefix "$scope/" --query 'length(Contents || `[]`)' \
            --output text 2>&1 | sed 's/^/    /'

          echo ""
          echo "### Classification"
          cat "$RUNNER_TEMP/classification.txt"

          aws s3api delete-object --endpoint-url "https://$ENDPOINT" \
            --bucket "$BUCKET" --key "$present_key" >/dev/null 2>&1 || true

      - name: Reproduce the failure with pgBackRest itself, both addressing styles
        if: always()
        env:
          PGBACKREST_REPO1_S3_KEY: ${{ secrets.PGBACKREST_REPO1_S3_KEY }}
          PGBACKREST_REPO1_S3_KEY_SECRET: ${{ secrets.PGBACKREST_REPO1_S3_KEY_SECRET }}
          PGBACKREST_REPO1_CIPHER_PASS: ${{ secrets.PGBACKREST_REPO1_CIPHER_PASS }}
          PGBACKREST_REPO1_TYPE: ${{ vars.PGBACKREST_REPO1_TYPE }}
          PGBACKREST_REPO1_S3_BUCKET: ${{ vars.PGBACKREST_REPO1_S3_BUCKET }}
          PGBACKREST_REPO1_S3_ENDPOINT: ${{ vars.PGBACKREST_REPO1_S3_ENDPOINT }}
          PGBACKREST_REPO1_S3_REGION: ${{ vars.PGBACKREST_REPO1_S3_REGION }}
          PGBACKREST_REPO1_S3_KEY_TYPE: ${{ vars.PGBACKREST_REPO1_S3_KEY_TYPE }}
          PGBACKREST_REPO1_CIPHER_TYPE: ${{ vars.PGBACKREST_REPO1_CIPHER_TYPE }}
          PGBACKREST_REPO1_PATH: /operation-class-probe/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          . /etc/os-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]" \
               "https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pgbackrest
          pgbackrest version

          root="$RUNNER_TEMP/probe"
          mkdir -p "$root/logs" "$root/locks"
          conf="$root/pgbackrest.conf"

          # `info` reads the repository and nothing else, so it reproduces the
          # failing read without needing a PostgreSQL cluster at all. The
          # rehearsal fails on a HEAD of archive.info; this issues the same
          # class of request against the same repository.
          for style in host path; do
            printf '\n=== pgbackrest info with repo1-s3-uri-style=%s\n' "$style"
            cat >"$conf" <<CONF
          [global]
          repo1-s3-uri-style=$style
          repo1-storage-verify-tls=y
          log-path=$root/logs
          lock-path=$root/locks
          log-level-console=detail

          [probe]
          pg1-path=$root/pgdata
          CONF
            pgbackrest --config="$conf" --stanza=probe info 2>&1 | sed 's/^/    /'
            printf '    exit: %s\n' "${PIPESTATUS[0]}"
          done
