name: Coolify MCP gateway CI
on:
  pull_request:
    paths:
      - 'services/coolify-mcp-gateway/**'
      - '.github/workflows/coolify-mcp-gateway-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r services/coolify-mcp-gateway/requirements.txt
      - name: Verify FastMCP OAuth runtime imports
        run: |
          python - <<'PY'
          from fastmcp import FastMCP
          from fastmcp.server.auth.providers.github import GitHubProvider
          from key_value.aio.stores.disk import DiskStore
          from key_value.aio.wrappers.encryption import FernetEncryptionWrapper
          print('MCP dependencies import successfully')
          PY
      - name: Test read-only gateway policy
        working-directory: services/coolify-mcp-gateway
        run: python -m unittest -v test_gateway_core
      - name: Syntax check
        run: python -m compileall -q services/coolify-mcp-gateway
