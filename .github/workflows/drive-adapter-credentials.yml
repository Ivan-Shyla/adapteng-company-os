name: Drive Adapter credentials

# Binds adapteng-drive-adapter's governed-operations Google credential.
#
# Not a new credential: services/adapteng-drive-adapter/app/config.py's
# governed code path reads GOOGLE_SERVICE_ACCOUNT_JSON_B64 (a base64-encoded
# copy of the existing GOOGLE_SERVICE_ACCOUNT_JSON secret), a different
# credential CONTRACT, not a different credential. The value is never
# printed, returned, or written to disk here.
#
# status reports what is bound, by presence and shape, never by value.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "status reads only; bind-google-credential re-encodes the existing service-account key and mounts it"
        required: true
        default: status
        type: choice
        options:
          - status
          - bind-google-credential

permissions:
  contents: read

concurrency:
  group: drive-adapter-credentials
  cancel-in-progress: false

jobs:
  drive:
    name: Credentials ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.11"

      - name: Bind the drive-adapter credentials
        env:
          OPERATION: ${{ inputs.operation }}
          COOLIFY_API_CREDENTIAL: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_URL }}
          GOOGLE_SERVICE_ACCOUNT_MATERIAL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/drive_adapter_credentials.py "$OPERATION"
